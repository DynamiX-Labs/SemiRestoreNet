# =============================================================================
# SemiRestoreNet — Stage 2 Fine-Tuning Configuration (Target: 32 dB Metrology)
# =============================================================================

# --- Model Architecture ---
in_channels: 1                         # Grayscale SEM image
num_feat: 64                           # Intermediate feature channels
num_grow_ch: 32                        # Growth channels per Dense Block
num_rrdb_blocks: [8, 8, 7]             # True 23-RRDB Teacher depth (8 + 8 + 7)
window_size: 8                         # Base Swin window size
upscale_factor: 2                      # 2 for 2x super-resolution (128x128 -> 256x256)
drop_path_rate: 0.05                   # Reduced stochastic depth for stable fine-tuning
use_log_domain: true                   # Signed homomorphic log-domain stream for multiplicative speckle

# --- Metrology-Preserving Fine-Tuning Loss Stack ---
lambda_charb: 1.0                      # Primary: Spatially-weighted Charbonnier L1
lambda_ssim: 0.15                      # Boosted: Structural similarity for SSIM > 0.88
lambda_edge: 0.08                      # Boosted: Sobel gradient sharpness (CD line protection)
lambda_fft: 0.01                       # Supporting: Frequency power spectrum matching
lambda_fidelity: 0.02                  # Relaxed anti-hallucination constraint for fine-detail recovery
edge_boost: 5.0                        # 5x pixel loss weight on defect / edge boundaries (CD protection)
fft_cap: 2.0                           # Capping maximum frequency weighting (anti-ringing)
enable_fft: true

# --- Optimization & Fast Runtime Acceleration ---
resume_checkpoint: "./checkpoints/best_model.pth"  # Resume from Stage 1 25.2 dB checkpoint
learning_rate: 2.0e-5                  # Fine-tuning learning rate
lr_backbone_scale: 0.1                 # 0.1x LR for pretrained backbone (2.0e-6)
min_lr: 1.0e-7
weight_decay: 1.0e-4
warmup_epochs: 1                       # 1-epoch quick warmup
total_epochs: 10                       # 10 fast fine-tuning epochs
patch_size: 128                        # 128x128 crop training (fast 1.1 it/s execution, zero VRAM swapping)
batch_size: 2                          # 2 patches per batch
accumulation_steps: 8                  # 8x accumulation = Effective Batch Size 16
max_val_samples: 100                   # Fast 100-sample validation (reduces epoch time by 65%!)
num_workers: 0                         # Main thread loading (optimal on Windows)
use_amp: true                          # Automatic Mixed Precision for 2x GPU speed
