# =============================================================================
# SemiRestoreNet — Clean Training Configuration (KLA Metrology Benchmark)
# =============================================================================

# --- Model Architecture ---
in_channels: 1                         # Grayscale SEM image
num_feat: 64                           # Intermediate feature channels
num_grow_ch: 32                        # Growth channels per Dense Block
num_rrdb_blocks: [8, 8, 7]             # True 23-RRDB Teacher depth (8 + 8 + 7)
window_size: 8                         # Base Swin window size
upscale_factor: 2                      # 2 for 2x super-resolution (128x128 -> 256x256)
drop_path_rate: 0.10                   # Stochastic depth regularization
use_log_domain: true                   # Signed homomorphic log-domain stream for multiplicative speckle

# --- Loss Configuration ---
lambda_charb: 1.0                      # Primary: Spatially-weighted Charbonnier L1
lambda_ssim: 0.1                       # Primary: Structural similarity
lambda_edge: 0.05                      # Primary: Sobel gradient sharpness (CD protection)
lambda_fft: 0.01                       # Supporting: Frequency power spectrum matching
lambda_fidelity: 0.05                  # Anti-Hallucination: Input degradation-consistency fidelity loss (0.0 to disable)
edge_boost: 5.0                        # 5x pixel loss weight on defect / edge boundaries (CD protection)
fft_cap: 2.0                           # Capping maximum frequency weighting (anti-ringing)
enable_fft: true

# --- Optimization & Transfer Learning ---
pretrained_weights: "./checkpoints/RealESRGAN_x4plus.pth"  # Pretrained Real-ESRGAN RRDB weights for transfer learning
lr_backbone_scale: 0.1                 # 0.1x LR for pretrained RRDB backbone (frozen-like fine-tuning)
learning_rate: 1.0e-4
min_lr: 1.0e-7
weight_decay: 1.0e-4
warmup_epochs: 3
total_epochs: 60
patch_size: 128                        # 128x128 training patch cropping (standard for super-resolution)
batch_size: 2                          # 2 patches per batch
accumulation_steps: 8                  # 8x accumulation = Effective Batch Size 16
num_workers: 0                         # Main thread loading (optimal on Windows)
use_amp: true                          # FP16 Automatic Mixed Precision (Tensor Cores)
ema_decay: 0.999                       # Exponential Moving Average for validation weights

# --- Paths ---
checkpoint_dir: "./checkpoints"
log_dir: "./runs"
save_interval: 5
eval_interval: 1
# Decoupled layer-wise parameter groups
